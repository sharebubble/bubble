  /api/books/:
    get:
      operationId: books_list
      description: |-
        ViewSet for managing books.

        Dynamically includes both Book instances and Items with category='books'.
        When an Item with category='books' is accessed, it's automatically promoted
        to a Book instance via signals.

        list: Get all books
        retrieve: Get a specific book by UUID
        create: Create a new book
        update: Update a book
        partial_update: Partially update a book
        destroy: Delete a book
      parameters:
        - in: query
          name: author
          schema:
            type: number
        - in: query
          name: author_name
          schema:
            type: string
        - in: query
          name: genre
          schema:
            type: number
        - in: query
          name: genre_name
          schema:
            type: string
        - in: query
          name: isbn
          schema:
            type: string
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - in: query
          name: publisher
          schema:
            type: number
        - in: query
          name: publisher_name
          schema:
            type: string
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: shelf
          schema:
            type: number
        - in: query
          name: shelf_name
          schema:
            type: string
        - in: query
          name: topic
          schema:
            type: string
        - in: query
          name: year
          schema:
            type: integer
        - in: query
          name: year_max
          schema:
            type: integer
        - in: query
          name: year_min
          schema:
            type: integer
      tags:
        - books
      security:
        - cookieAuth: []
        - tokenAuth: []
        - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
