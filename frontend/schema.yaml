  /api/public-items/:
    get:
      operationId: public_items_list
      description: |-
        ViewSet for retrieving published items.
        This viewset is read-only and only returns items with a published status.

        Visibility rules:
        - PUBLIC (0): visible to everyone including anonymous users.
        - AUTHENTICATED (1): visible to any logged-in user.
        - SPECIFIC (2): visible only to users/groups explicitly granted view_item.
        - PRIVATE (3): visible only to the owner and co-owners (change_item holders).
      parameters:
        - in: query
          name: category
          schema:
            type: string
            enum:
              - books
              - clothing
              - electronics
              - furniture
              - garden
              - kitchen
              - other
              - rooms
              - sports
              - tools
              - toys
              - vehicles
          description: |-
            Category of the item

            * `books` - Books
            * `clothing` - Clothing
            * `electronics` - Electronics
            * `furniture` - Furniture
            * `garden` - Garden
            * `kitchen` - Kitchen
            * `other` - Other
            * `rooms` - Rooms
            * `sports` - Sports
            * `tools` - Tools
            * `toys` - Toys
            * `vehicles` - Vehicles
        - in: query
          name: conditions
          schema:
            type: array
            items:
              type: integer
              enum:
                - 0
                - 1
                - 2
          description: |-
            Condition of the item

            * `0` - New
            * `1` - Used
            * `2` - Broken
          explode: true
          style: form
        - in: query
          name: created_after
          schema:
            type: string
            format: date-time
        - in: query
          name: created_before
          schema:
            type: string
            format: date-time
        - in: query
          name: max_price
          schema:
            type: number
        - in: query
          name: min_price
          schema:
            type: number
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - in: query
          name: published
          schema:
            type: boolean
        - in: query
          name: sales_type
          schema:
            type: array
            items:
              type: string
              enum:
                - borrow
                - donate
                - rent
                - sell
                - want_buy
                - want_rent
          description: |-
            How the item is offered: Sell, Donate, Rent, Borrow, Want to Buy, or Want to Rent.

            * `sell` - Sell
            * `donate` - Donate
            * `rent` - Rent
            * `borrow` - Borrow
            * `want_buy` - Want to Buy
            * `want_rent` - Want to Rent
          explode: true
          style: form
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: array
            items:
              type: integer
              enum:
                - 0
                - 1
                - 2
                - 3
                - 4
                - 5
          description: |-
            * `0` - Draft
            * `1` - Processing
            * `2` - Available
            * `3` - Reserved
            * `4` - Rented
            * `5` - Sold
          explode: true
          style: form
        - in: query
          name: user
          schema:
            type: string
            format: uuid
      tags:
        - public-items
      security:
        - cookieAuth: []
        - tokenAuth: []
        - XSessionTokenAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItemListList'
          description: ''
