components:
  schemas:
    ActionEnum:
      enum:
        - item_added
        - item_removed
      type: string
      description: |-
        * `item_added` - Item added
        * `item_removed` - Item removed
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
        - password
        - token
        - username
    Author:
      type: object
      description: Serializer for Author model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        website:
          type: string
          format: uri
          maxLength: 200
        bio:
          type: string
        books_count:
          type: string
          readOnly: true
      required:
        - books_count
        - id
        - name
    BlankEnum:
      enum:
        - ''
    Book:
      type: object
      description: Serializer for Book detail view.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        first_image:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        co_owners:
          type: string
          readOnly: true
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'
          readOnly: true
        author_ids:
          type: array
          items:
            type: string
            format: uuid
            writeOnly: true
          writeOnly: true
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
          readOnly: true
        genre_ids:
          type: array
          items:
            type: string
            format: uuid
            writeOnly: true
          writeOnly: true
        verlag:
          allOf:
            - $ref: '#/components/schemas/Publisher'
          readOnly: true
        verlag_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        shelf:
          allOf:
            - $ref: '#/components/schemas/Shelf'
          readOnly: true
        shelf_id:
          type: string
          format: uuid
          writeOnly: true
          nullable: true
        category:
          description: |-
            Category of the item

            * `books` - Books
            * `clothing` - Clothing
            * `electronics` - Electronics
            * `furniture` - Furniture
            * `garden` - Garden
            * `kitchen` - Kitchen
            * `other` - Other
            * `rooms` - Rooms
            * `sports` - Sports
            * `tools` - Tools
            * `toys` - Toys
            * `vehicles` - Vehicles
          oneOf:
            - $ref: '#/components/schemas/CategoryEnum'
            - $ref: '#/components/schemas/BlankEnum'
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        internal:
          type: boolean
          description: Internal item, not for public display
        display_contact:
          type: boolean
          description: Display your contact information public
        sales_type:
          allOf:
            - $ref: '#/components/schemas/SalesTypeEnum'
          description: |-
            How the item is offered: Sell, Donate, Rent, Borrow, Want to Buy, or Want to Rent.

            * `sell` - Sell
            * `donate` - Donate
            * `rent` - Rent
            * `borrow` - Borrow
            * `want_buy` - Want to Buy
            * `want_rent` - Want to Rent
        price_currency:
          type: string
          readOnly: true
          nullable: true
        rental_period:
          oneOf:
            - $ref: '#/components/schemas/RentalPeriodEnum'
            - $ref: '#/components/schemas/BlankEnum'
        rental_self_service:
          type: boolean
          description: Allow self-service rental without owner approval
        rental_open_end:
          type: boolean
          description: Allow open-ended rentals without a return date
        payment_enabled:
          type: boolean
          description: Enable payment via internal payment system
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        condition:
          allOf:
            - $ref: '#/components/schemas/ConditionEnum'
          description: |-
            Condition of the item

            * `0` - New
            * `1` - Used
            * `2` - Broken
          minimum: -2147483648
          maximum: 2147483647
        active:
          type: boolean
        status:
          allOf:
            - $ref: '#/components/schemas/Status402Enum'
          minimum: -2147483648
          maximum: 2147483647
        visibility:
          allOf:
            - $ref: '#/components/schemas/VisibilityEnum'
          description: |-
            Who can see this item: Public (everyone), Authenticated (logged-in users), Specific (selected users/groups), or Private (owner and co-owners only).

            * `0` - Public
            * `1` - Authenticated
            * `2` - Specific
            * `3` - Private
          minimum: -2147483648
          maximum: 2147483647
        isbn:
          type: string
          maxLength: 13
        language:
          type: string
          description: Language of the book
          maxLength: 50
        year:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Publication year
        topic:
          type: string
          description: Main topic or subject
          maxLength: 255
        metadata:
          nullable: true
          description: Raw metadata fetched from external sources like ISBN databases
      required:
        - authors
        - co_owners
        - created_at
        - first_image
        - genres
        - id
        - images
        - price_currency
        - sales_type
        - shelf
        - updated_at
        - user
        - verlag
