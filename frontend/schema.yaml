  /api/books/{id}/isbn_update/:
    put:
      operationId: books_isbn_update_update
      description: |-
        Update book details from OpenLibrary based on ISBN.

        Optionally provide an ISBN in the request body to update the book with data
        from OpenLibrary. If no ISBN is provided, the book's existing ISBN will be used.
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          description: A UUID string identifying this book.
          required: true
      tags:
        - books
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isbn:
                  type: string
                  description: ISBN number to fetch book details from OpenLibrary
                    API. If not provided, uses the book's existing ISBN.
                  example: '9780980200447'
      security:
        - cookieAuth: []
        - tokenAuth: []
        - XSessionTokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
