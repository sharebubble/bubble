# Security headers, kept in a snippet because nginx's `add_header` does not
# inherit into a location that sets any header of its own. Every location below
# that adds a Cache-Control or Content-Type therefore has to include this file
# again, or it silently serves the response without a CSP.
#
# Basic secure Content Security Policy: blocks all by default, allows self for
# scripts/styles/images/fonts, disallows inline JS, no external frames.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; script-src-elem 'self'; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'" always;
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy 'strict-origin-when-cross-origin';
add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(self),camera=(self),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()";
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options  "nosniff";
