name: Conventional Commits

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commits:
    runs-on: ubuntu-latest
    steps:
      - name: Validate commit messages
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number,
              per_page: 100
            });

            // Enforces:
            //   - valid lowercase type (with optional revert: prefix)
            //   - optional lowercase scope
            //   - optional breaking-change marker (!)
            //   - description starts with a lowercase letter
            //   - description does not end with a period or trailing whitespace
            const conventional = /^(revert: )?(build|chore|ci|docs|feat|fix|perf|refactor|style|test)(\([a-z0-9._\/-]+\))?!?: [a-z].*[^\s.]$/;

            const invalid = commits
              // Skip merge commits (auto-generated by GitHub)
              .filter((c) => c.parents.length < 2)
              .filter((c) => !conventional.test(c.commit.message.split("\n")[0]));

            if (invalid.length > 0) {
              core.setFailed(
                [
                  "The following commit messages do not follow Conventional Commits (https://www.conventionalcommits.org/):",
                  "  Format : <type>(<scope>): <description>",
                  "  Types  : build | chore | ci | docs | feat | fix | perf | refactor | style | test",
                  "  Rules  : description starts lowercase, no trailing period or whitespace",
                  "",
                  ...invalid.map((c) => `  - ${c.sha.slice(0, 7)}: ${c.commit.message.split("\n")[0]}`)
                ].join("\n")
              );
            }
