name: E2E (stage)

# Runs the Playwright suite against the stage environment (main.sharebubble.org).
# It first confirms stage is actually serving the commit under test (the version
# guard), so tests never run against a half-finished ArgoCD rollout, then runs
# the suite. See docs/e2e-testing/plan.md §7.
on:
  # After CI succeeds on main (images built → ArgoCD auto-syncs stage).
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Regular drift check.
  schedule:
    - cron: '0 */3 * * *'
  # Manual, optionally against a specific commit already deployed to stage.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA expected on stage (default: latest main)'
        required: false

concurrency:
  # Only the latest commit's run should gate; supersede older in-flight runs.
  group: e2e-stage
  cancel-in-progress: true

jobs:
  e2e:
    # For workflow_run, only proceed when CI actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: e2e # holds E2E_* secrets/vars
    permissions:
      contents: read
    steps:
      - name: Resolve target commit
        id: target
        shell: bash
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            SHA="$INPUT_SHA"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="$RUN_SHA"
          else
            SHA="$PUSH_SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Target commit: $SHA"

      - name: Checkout (matching the deployed commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait until stage serves this commit (version guard)
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://main.sharebubble.org' }}
          E2E_WAIT_TIMEOUT_MS: '900000' # 15 min: cover ArgoCD requeue + rollout
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/wait-for-version.mjs "$EXPECTED_SHA"

      - name: Run E2E suite
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://main.sharebubble.org' }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E2E_OWNER_USERNAME: ${{ secrets.E2E_OWNER_USERNAME }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_RENTERA_USERNAME: ${{ secrets.E2E_RENTERA_USERNAME }}
          E2E_RENTERA_PASSWORD: ${{ secrets.E2E_RENTERA_PASSWORD }}
          E2E_RENTERB_USERNAME: ${{ secrets.E2E_RENTERB_USERNAME }}
          E2E_RENTERB_PASSWORD: ${{ secrets.E2E_RENTERB_PASSWORD }}
          E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report
          retention-days: 14
