x-backend: &backend
  build:
    context: ./backend/
    dockerfile: Dockerfile
    target: dev
  image: bubble-backend
  restart: unless-stopped
  depends_on:
    - postgres
    - redis
    - mailpit
  volumes:
    - ./backend:/app:z
  env_file:
    - ./backend/.env-docker.local
  environment:
    - GEMINI_API_KEY=${GEMINI_API_KEY:-not_set}
    - FRONTEND_URL=http://localhost:8080
    # Browser push (VAPID) — `just manage generate_vapid_keys` prints a pair.
    # Push stays disabled while these are empty. See docs/pwa.md.
    - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
    - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
    - VAPID_SUBJECT=${VAPID_SUBJECT:-}

volumes:
  bubble_local_postgres_data: {}
  bubble_local_redis_data: {}
  bubble_local_rustfs_data: {}

services:
  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile.dev
    image: bubble-frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_PROXY_URL=${VITE_PROXY_URL:-http://backend:8000}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
      - VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT:-local}
    volumes:
      - ./frontend/src:/app/src:z
    ports:
      - '127.0.0.1:8080:8080'

  backend:
    <<: *backend
    command: sh -c "python3 manage.py migrate && uvicorn config.asgi:application --host 0.0.0.0 --reload"

  postgres:
    image: docker.io/library/postgres:17
    restart: always
    volumes:
      - bubble_local_postgres_data:/var/lib/postgresql/data
    env_file:
      - ./backend/.env-docker.local

  mailpit:
    image: docker.io/axllent/mailpit:latest

  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  huey:
    <<: *backend
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: sh -c "watchfiles --filter python 'python manage.py run_huey' bubble"

  isbn-search:
    image: ghcr.io/sharebubble/isbn-search:latest
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=1 # Uncomment to enable verbose logging
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # RustFS — S3-compatible object storage for local development.
  # Enable with: docker compose --profile rustfs up
  # Console UI: http://localhost:9001  (user: rustfsadmin / rustfsadmin)
  # API endpoint for the backend: http://rustfs:9000
  #
  # To use RustFS, add the following to backend/.env-docker.local:
  #   STORAGE_BACKEND=s3
  #   S3_ACCESS_KEY=rustfsadmin
  #   S3_SECRET_KEY=rustfsadmin
  #   S3_BUCKET=bubble
  #   S3_ENDPOINT_URL=http://rustfs:9000
  #   S3_CUSTOM_DOMAIN=localhost:9000/bubble
  # ---------------------------------------------------------------------------
  rustfs:
    profiles: [rustfs]
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - bubble_local_rustfs_data:/data
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # Web console
    healthcheck:
      test: ['CMD', 'sh', '-c', 'curl -f http://127.0.0.1:9000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # One-shot container that creates the default bucket when RustFS starts.
  rustfs-init:
    profiles: [rustfs]
    image: quay.io/minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin &&
        mc mb --ignore-existing local/bubble &&
        mc anonymous set download local/bubble
      "
